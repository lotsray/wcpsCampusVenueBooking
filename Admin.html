
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  background: #f5f7fb;
  color: #1e293b;
  font-family: system-ui, "Noto Sans TC", sans-serif;
  font-size: 14px;
}

h2 { margin: 0; font-size: 19px; }
small { color: #64748b; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.summary {
  padding: 12px;
  background: white;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid #e2e8f0;
}

.summary strong {
  color: #2455d6;
  font-size: 24px;
}

select, textarea {
  width: 100%;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 9px;
  font: inherit;
  background: white;
}

textarea {
  resize: vertical;
  min-height: 60px;
}

button {
  border: 1px solid #cbd5e1;
  background: white;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

button.primary {
  background: #2455d6;
  color: white;
  border-color: #2455d6;
}

button.danger {
  color: #b91c1c;
  border-color: #fecaca;
}

.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.card h3 {
  font-size: 16px;
  margin: 8px 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 12px;
  background: #e2e8f0;
}

.badge.PENDING {
  color: #92400e;
  background: #fef3c7;
}

.badge.APPROVED {
  color: #1d4ed8;
  background: #dbeafe;
}

.badge.REJECTED {
  color: #991b1b;
  background: #fee2e2;
}

.badge.CANCELLED {
  color: #475569;
  background: #e2e8f0;
}

.info {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 8px;
  margin: 12px 0;
  line-height: 1.5;
}

.info dt { color: #64748b; }
.info dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.message {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
  background: #e2e8f0;
  white-space: pre-wrap;
}

.message.error {
  background: #fee2e2;
  color: #991b1b;
}

.message.ok {
  background: #dcfce7;
  color: #166534;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #64748b;
}

#loading {
  color: #64748b;
  text-align: center;
  padding: 16px;
}
</style>
</head>

<body>
  <div class="header">
    <h2>場地預約審核</h2>
    <button id="refresh" onclick="loadData()">
      重新整理
    </button>
  </div>

  <div class="summary">
    待審核申請<br>
    <strong id="pendingCount">—</strong>
    <div>
      <small id="adminEmail"></small>
    </div>
  </div>

  <div class="filters">
    <select id="filter" onchange="render()">
      <option value="PENDING">待審核</option>
      <option value="APPROVED">已核准</option>
      <option value="REJECTED">已駁回</option>
      <option value="CANCELLED">已取消</option>
      <option value="ALL">全部申請</option>
    </select>
  </div>

  <div id="message" hidden></div>
  <div id="loading">正在讀取預約資料…</div>
  <div id="list"></div>

<script>
'use strict';

let groups = [];
let busy = false;

const $ = id => document.getElementById(id);

const STATUS_TEXT = {
  PENDING: '待審核',
  APPROVED: '已核准',
  REJECTED: '已駁回',
  CANCELLED: '已取消',
  MIXED: '狀態不一致'
};

function showMessage(text, type = '') {
  const el = $('message');

  el.hidden = !text;
  el.className = 'message ' + type;
  el.textContent = text;
}

function node(tag, text, className) {
  const el = document.createElement(tag);

  if (text !== undefined) {
    el.textContent = text;
  }

  if (className) {
    el.className = className;
  }

  return el;
}

function loadData() {
  if (busy) return;

  $('loading').hidden = false;
  $('refresh').disabled = true;
  showMessage('');

  google.script.run
    .withSuccessHandler(data => {
      $('loading').hidden = true;
      $('refresh').disabled = false;

      groups = data.groups || [];

      $('pendingCount').textContent =
        data.pending_count;

      $('adminEmail').textContent =
        '管理員：' + data.admin;

      render();
    })
    .withFailureHandler(err => {
      $('loading').hidden = true;
      $('refresh').disabled = false;

      showMessage(
        '讀取失敗：' + err.message,
        'error'
      );
    })
    .getAdminDashboard();
}

function infoRow(dl, label, value) {
  dl.append(
    node('dt', label),
    node('dd', value)
  );
}

function render() {
  const filter = $('filter').value;
  const list = $('list');

  list.replaceChildren();

  const filtered = groups.filter(g =>
    filter === 'ALL' ||
    g.status === filter
  );

  if (!filtered.length) {
    list.append(
      node(
        'div',
        '目前沒有符合條件的預約申請',
        'empty'
      )
    );
    return;
  }

  filtered.forEach(g => {
    const card = node('article', '', 'card');

    const badge = node(
      'span',
      STATUS_TEXT[g.status] || g.status,
      'badge ' + g.status
    );

    const title = node(
      'h3',
      g.activity_name
    );

    const dl = node('dl', '', 'info');

    infoRow(dl, '場地', g.venue_name);
    infoRow(
      dl,
      '借用人',
      g.borrower_name
    );
    infoRow(
      dl,
      '單位',
      g.borrower_unit
    );
    infoRow(
      dl,
      '節次',
      g.period_names.join('、')
    );
    infoRow(
      dl,
      '日期',
      g.dates.join('、')
    );
    infoRow(
      dl,
      '筆數',
      String(g.count)
    );

    const note = node('textarea');
    note.placeholder = '審核備註（選填，最多 200 字）';
    note.maxLength = 200;

    const actions = node('div', '', 'actions');

    if (g.status === 'PENDING') {
      const approve = node(
        'button',
        '核准',
        'primary'
      );

      approve.onclick = () =>
        review(g, 'APPROVED', note.value);

      const reject = node(
        'button',
        '駁回',
        'danger'
      );

      reject.onclick = () =>
        review(g, 'REJECTED', note.value);

      actions.append(approve, reject);
    }

    if (
      g.status === 'PENDING' ||
      g.status === 'APPROVED'
    ) {
      const cancel = node(
        'button',
        '取消預約'
      );

      cancel.onclick = () =>
        review(g, 'CANCELLED', note.value);

      actions.append(cancel);
    }

    card.append(
      badge,
      title,
      dl
    );

    if (actions.childElementCount) {
      card.append(note, actions);
    }

    list.append(card);
  });
}

function review(group, target, note) {
  if (busy) return;

  const action = {
    APPROVED: '核准',
    REJECTED: '駁回',
    CANCELLED: '取消'
  }[target];

  const confirmed = confirm(
    '確定要' + action + '這組預約嗎？\n\n' +
    '活動：' + group.activity_name + '\n' +
    '場地：' + group.venue_name + '\n' +
    '日期筆數：' + group.count + '\n\n' +
    '這項操作將套用到整組預約。'
  );

  if (!confirmed) return;

  busy = true;

  $('refresh').disabled = true;

  document.querySelectorAll(
    '.actions button'
  ).forEach(b => b.disabled = true);

  showMessage(
    '正在執行' + action + '…'
  );

  google.script.run
    .withSuccessHandler(result => {
      busy = false;

      showMessage(
        '操作成功：已' + action +
        ' ' + result.count + ' 筆預約。',
        'ok'
      );

      loadData();
    })
    .withFailureHandler(err => {
      busy = false;
      $('refresh').disabled = false;

      showMessage(
        '操作失敗：' + err.message,
        'error'
      );

      render();
    })
    .reviewBookingGroup(
      group.group_id,
      target,
      note
    );
}

loadData();
</script>
</body>
</html>
