
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五常國小｜場地預約系統</title>
<style>
:root{
  --navy:#17365d;--blue:#2563eb;--bg:#f4f7fb;
  --line:#e2e8f0;--muted:#64748b;--green:#15803d;
  --red:#b91c1c;--amber:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#243449;
  font-family:Arial,"Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px}
button:disabled{opacity:.45;cursor:not-allowed}
header{background:var(--navy);color:white;padding:19px 22px}
header h1{font-size:22px;margin:0 0 5px}
header small{opacity:.8}
main{max-width:1250px;margin:22px auto;padding:0 16px}
.panel{background:white;border:1px solid var(--line);
  border-radius:13px;padding:17px;margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar select,.field input,.field select,.field textarea{
  border:1px solid #cbd5e1;border-radius:8px;
  padding:10px;background:white;width:100%}
.toolbar select{width:auto;min-width:150px}
.primary{background:var(--navy);color:white}
.secondary{background:#e9eef6;color:#334155}
.active{background:var(--blue);color:white}
.danger{background:var(--red);color:white}
.success{background:var(--green);color:white}
.spacer{flex:1}
h2{font-size:19px;margin:0}
h3{font-size:16px}
.muted{color:var(--muted)}
#notice{display:none;padding:12px 14px;border-radius:9px;margin-bottom:14px}
#notice.info{display:block;background:#dbeafe;color:#1e40af}
#notice.error{display:block;background:#fee2e2;color:#991b1b}
#notice.ok{display:block;background:#dcfce7;color:#166534}
.weekdays,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekdays>div{text-align:center;padding:12px 3px;
  background:#edf2fa;font-size:12px;font-weight:bold}
.month{border-left:1px solid var(--line);border-top:1px solid var(--line)}
.day{min-height:115px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:7px;
  background:white;text-align:left;border-radius:0;
  display:flex;flex-direction:column;gap:6px;min-width:0}
.day:hover{background:#eff6ff}
.day.outside{background:#f8fafc;color:#94a3b8}
.day.today .daynum{background:var(--navy);color:white}
.daynum{display:inline-flex;width:25px;height:25px;
  align-items:center;justify-content:center;border-radius:50%;
  font-weight:bold;font-size:12px}
.event{font-size:11px;padding:4px 5px;border-radius:5px;
  background:#dbeafe;color:#1e40af;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.event.pending{background:#fef3c7;color:#92400e}
.more{font-size:11px;color:var(--muted)}
.gridscroll{overflow-x:auto}
.weektable{width:100%;border-collapse:collapse;min-width:670px}
.weektable th,.weektable td{border:1px solid var(--line);
  padding:9px 5px;vertical-align:top;text-align:center}
.weektable th{background:#edf2fa}
.weektable td{height:68px;cursor:pointer}
.weektable td:hover{background:#eff6ff}
.periodcol{width:100px;font-weight:bold;background:#f8fafc}
.slot{display:block;padding:5px;border-radius:6px;
  margin-bottom:4px;font-size:11px;overflow-wrap:anywhere}
.slot.approved{background:#dbeafe;color:#1e40af}
.slot.pending{background:#fef3c7;color:#92400e}
.slot.free{background:#dcfce7;color:#166534}
.daylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.periodcard{border:1px solid var(--line);border-radius:9px;
  padding:12px;background:white;text-align:left}
.periodcard.busy{border-color:#f3c68b}
.periodcard b{display:block;margin-bottom:7px}
.periodcard small{display:block;line-height:1.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.field{margin:12px 0}
.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:5px}
.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.checkitem{border:1px solid var(--line);padding:9px 6px;
  border-radius:8px;font-size:12px;display:flex;align-items:center;gap:5px}
.checkitem input{width:auto}
.modalback{position:fixed;inset:0;background:#0f172a99;
  display:none;align-items:center;justify-content:center;
  padding:15px;z-index:20}
.modal{background:white;border-radius:14px;padding:20px;
  width:min(100%,530px);max-height:94vh;overflow-y:auto}
.modalhead{display:flex;align-items:center;justify-content:space-between}
.modalhead h2{margin:0}
.modalactions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
#resultArea{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:650px){
  header h1{font-size:19px}
  .panel{padding:12px}
  .day{min-height:85px;padding:4px;gap:3px}
  .daynum{font-size:11px}
  .event{font-size:10px}
  .checkgrid{grid-template-columns:repeat(2,1fr)}
  .toolbar select{width:100%}
  .spacer{display:none}
}
</style>
</head>
<body>

<header>
  <h1>五常國小｜場地預約系統</h1>
  <small>校園場地查詢・借用申請・審核進度</small>
</header>

<main>
  <div id="notice" role="status"></div>

  <section class="panel">
    <div class="toolbar">
      <select id="venueSelect" aria-label="選擇場地"></select>
      <button class="secondary" id="prevBtn">‹ 上一頁</button>
      <button class="secondary" id="todayBtn">今天</button>
      <button class="secondary" id="nextBtn">下一頁 ›</button>
      <div class="spacer"></div>
      <button class="secondary" data-view="month">月</button>
      <button class="secondary" data-view="week">週</button>
      <button class="secondary" data-view="day">日</button>
    </div>
    <div class="toolbar" style="margin-top:16px">
      <h2 id="calendarTitle"></h2>
      <div class="spacer"></div>
      <button class="primary" id="newBookingBtn">＋ 申請場地</button>
    </div>
  </section>

  <section class="panel">
    <div id="calendar"></div>
    <div class="legend">
      <span><i class="dot" style="background:#93c5fd"></i>已核准</span>
      <span><i class="dot" style="background:#fcd34d"></i>待審核</span>
      <span><i class="dot" style="background:#86efac"></i>可預約</span>
    </div>
  </section>

  <section class="panel">
    <h3>查詢我的申請</h3>
    <p class="muted" style="font-size:13px">
      輸入送出預約時取得的申請識別碼，查詢目前審核狀態。
    </p>
    <div class="toolbar">
      <input id="statusId" style="flex:1;min-width:180px;padding:10px;
        border:1px solid #cbd5e1;border-radius:8px"
        placeholder="申請識別碼（UUID）">
      <button class="primary" id="statusBtn">查詢進度</button>
    </div>
    <div id="statusResult" style="margin-top:12px"></div>
  </section>
</main>

<footer>五常國小｜場地借用管理</footer>

<div class="modalback" id="bookingModal">
  <div class="modal">
    <div class="modalhead">
      <h2>申請場地</h2>
      <button class="secondary" id="closeModal">✕</button>
    </div>

    <form id="bookingForm">
      <div class="field">
        <label for="formVenue">借用場地</label>
        <select id="formVenue" required></select>
      </div>

      <div class="field">
        <label for="formDate">開始日期</label>
        <input type="date" id="formDate" required>
      </div>

      <div class="field">
        <label>借用節次</label>
        <div id="periodChecks" class="checkgrid"></div>
      </div>

      <div class="field">
        <label for="repeatType">預約方式</label>
        <select id="repeatType">
          <option value="single">單次預約</option>
          <option value="weekly">每週重複預約</option>
        </select>
      </div>

      <div id="weeklyFields" class="hidden">
        <div class="field">
          <label for="repeatEnd">重複截止日期</label>
          <input type="date" id="repeatEnd">
        </div>
        <div class="field">
          <label>每週星期</label>
          <div id="weekdayChecks" class="checkgrid"></div>
        </div>
      </div>

      <div class="field">
        <label for="activityName">活動名稱</label>
        <input id="activityName" maxlength="100" required
          placeholder="例如：自然領域研習">
      </div>

      <div class="field">
        <label for="borrowerName">借用人</label>
        <input id="borrowerName" maxlength="40" required>
      </div>

      <div class="field">
        <label for="borrowerUnit">借用單位</label>
        <input id="borrowerUnit" maxlength="60" required
          placeholder="例如：教務處">
      </div>

      <input id="websiteTrap" tabindex="-1" autocomplete="off"
        aria-hidden="true" class="hidden">

      <div id="formResult"></div>

      <div class="modalactions">
        <button type="button" class="secondary" id="cancelForm">返回</button>
        <button type="submit" class="primary" id="submitBtn">檢查並送出</button>
      </div>
    </form>
  </div>
</div>

<!-- 跨網域 POST 的表單目標 -->
<iframe id="postFrame" name="postFrame"
  style="display:none" title="預約提交通道"></iframe>
<form id="postForm" method="POST" target="postFrame"
  style="display:none">
  <input type="hidden" name="payload" id="postPayload">
</form>

<script>
'use strict';

const API = 'https://script.google.com/macros/s/AKfycbzzJyNToJW_FpluPUNm1YUDj-mr2BKJawAu8ApNy25Ps6bVtaAzO0_lbTPwN1Tvz2WVlw/exec';

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => new Date(s+'T12:00:00');
const addDays = (d,n) => {
  const x=new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};
const escapeHtml = s => String(s??'')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');

let initial=null;
let bookings=[];
let view='month';
let cursor=new Date();
let submitting=false;
let pendingRequest=null;
let calendarSequence=0;

const STATUS = {
  PENDING:'待審核',
  APPROVED:'已核准',
  REJECTED:'已駁回',
  CANCELLED:'已取消',
  MIXED:'狀態不一致'
};

function notice(message,type='info'){
  $('notice').textContent=message;
  $('notice').className=type;
}
function clearNotice(){
  $('notice').style.display='none';
  $('notice').className='';
}
function jsonp(action,params={},timeout=15000){
  return new Promise((resolve,reject)=>{
    const name='cb_'+Date.now()+'_'+
      Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let finished=false;
    let timer;

    function finish(err,data){
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      script.remove();
      try{delete window[name]}catch(_){}
      err?reject(err):resolve(data);
    }

    window[name]=data=>finish(null,data);
    const q=new URLSearchParams({
      action,callback:name,...params
    });
    script.src=API+'?'+q.toString();
    script.onerror=()=>finish(new Error('API 連線失敗'));
    timer=setTimeout(
      ()=>finish(new Error('API 回應逾時')),
      timeout
    );
    document.head.appendChild(script);
  });
}
async function api(action,params={}){
  const data=await jsonp(action,params);
  if(!data || data.success===false)
    throw new Error(data?.message||'API 執行失敗');
  return data;
}
function venueId(){return $('venueSelect').value}
function periodName(id){
  return initial?.periods.find(p=>p.period_id===id)?.period_name||id;
}
function venueName(id){
  return initial?.venues.find(v=>v.venue_id===id)?.venue_name||id;
}
function range(){
  if(view==='day'){
    const d=iso(cursor);
    return {start:d,end:d};
  }
  if(view==='week'){
    const d=new Date(cursor);
    d.setDate(d.getDate()-d.getDay());
    return {start:iso(d),end:iso(addDays(d,6))};
  }
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const gridStart=addDays(first,-first.getDay());
  return {start:iso(gridStart),end:iso(addDays(gridStart,41))};
}
async function loadCalendar(){
  const sequence=++calendarSequence;
  const r=range();
  notice('正在讀取場地預約……');
  try{
    const result=await api('getBookings',{
      start_date:r.start,end_date:r.end,
      venue_id:venueId()
    });
    if(sequence!==calendarSequence)return;
    bookings=result.bookings||[];
    renderCalendar();
    clearNotice();
  }catch(e){
    if(sequence!==calendarSequence)return;
    notice('無法載入日曆：'+e.message,'error');
    $('calendar').textContent='目前無法取得場地資料';
  }
}
function byDate(date,period){
  return bookings.filter(b=>
    b.booking_date===date &&
    (!period || b.period_ids.includes(period))
  );
}
function eventHtml(b){
  const status=b.status==='PENDING'?'pending':'approved';
  return `<div class="event ${status}"
    title="${escapeHtml(b.activity_name)}">
    ${escapeHtml(b.activity_name)}</div>`;
}
function renderCalendar(){
  const r=range();
  const title=$('calendarTitle');
  const box=$('calendar');

  if(view==='month'){
    title.textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月`;
    const first=parseDate(r.start);
    let html='<div class="weekdays">'+
      ['日','一','二','三','四','五','六']
        .map(d=>`<div>星期${d}</div>`).join('')+
      '</div><div class="month">';
    for(let i=0;i<42;i++){
      const d=addDays(first,i),day=iso(d);
      const events=byDate(day);
      const outside=d.getMonth()!==cursor.getMonth();
      const today=day===iso(new Date());
      html+=`<button class="day ${outside?'outside':''}
        ${today?'today':''}" data-date="${day}">
        <span class="daynum">${d.getDate()}</span>
        ${events.slice(0,3).map(eventHtml).join('')}
        ${events.length>3?`<span class="more">另有 ${events.length-3} 筆</span>`:''}
        </button>`;
    }
    box.innerHTML=html+'</div>';
    box.querySelectorAll('[data-date]').forEach(el=>{
      el.onclick=()=>{
        cursor=parseDate(el.dataset.date);
        view='day';updateViewButtons();loadCalendar();
      };
    });
    return;
  }

  if(view==='week'){
    const start=parseDate(r.start);
    title.textContent=`${r.start} ～ ${r.end}`;
    let html='<div class="gridscroll"><table class="weektable"><thead><tr>'+
      '<th>節次</th>';
    for(let i=0;i<7;i++){
      const d=addDays(start,i);
      html+=`<th>${['日','一','二','三','四','五','六'][i]}
        <div>${iso(d).slice(5)}</div></th>`;
    }
    html+='</tr></thead><tbody>';
    for(const p of initial.periods){
      html+=`<tr><td class="periodcol">${escapeHtml(p.period_name)}</td>`;
      for(let i=0;i<7;i++){
        const date=iso(addDays(start,i));
        const list=byDate(date,p.period_id);
        html+=`<td data-date="${date}" data-period="${p.period_id}">
          ${list.length?list.map(b=>
            `<span class="slot ${b.status==='PENDING'?'pending':'approved'}">
              ${escapeHtml(b.activity_name)}</span>`
          ).join(''):'<span class="slot free">可預約</span>'}
          </td>`;
      }
      html+='</tr>';
    }
    box.innerHTML=html+'</tbody></table></div>';
    box.querySelectorAll('td[data-date]').forEach(el=>{
      el.onclick=()=>openBooking(el.dataset.date,el.dataset.period);
    });
    return;
  }

  const date=iso(cursor);
  title.textContent=`${date}（星期${'日一二三四五六'[cursor.getDay()]}）`;
  box.innerHTML='<div class="daylist">'+initial.periods.map(p=>{
    const list=byDate(date,p.period_id);
    return `<button class="periodcard ${list.length?'busy':''}"
      data-period="${p.period_id}">
      <b>${escapeHtml(p.period_name)}</b>
      <small>${escapeHtml(p.start_time)}～${escapeHtml(p.end_time)}</small>
      ${list.length?list.map(b=>
        `<span class="slot ${b.status==='PENDING'?'pending':'approved'}">
          ${escapeHtml(b.activity_name)}（${STATUS[b.status]||b.status}）
        </span>`
      ).join(''):'<span class="slot free">可預約</span>'}
      </button>`;
  }).join('')+'</div>';

  box.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick=()=>openBooking(date,el.dataset.period);
  });
}
function updateViewButtons(){
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.className=b.dataset.view===view?'active':'secondary';
  });
}
function moveCalendar(n){
  const d=new Date(cursor);
  if(view==='month')d.setMonth(d.getMonth()+n);
  if(view==='week')d.setDate(d.getDate()+7*n);
  if(view==='day')d.setDate(d.getDate()+n);
  cursor=d;
  loadCalendar();
}
function openBooking(date,period){
  $('bookingForm').reset();
  $('formVenue').value=venueId();
  $('formDate').value=date||iso(new Date());
  $('formDate').min=iso(new Date());
  $('repeatEnd').min=$('formDate').value;
  $('repeatEnd').value=iso(addDays(parseDate($('formDate').value),28));
  $('weeklyFields').classList.add('hidden');
  $('formResult').textContent='';
  $('submitBtn').disabled=false;
  $('submitBtn').textContent='檢查並送出';
  document.querySelectorAll('#periodChecks input').forEach(el=>{
    el.checked=el.value===period;
  });
  setDefaultWeekday();
  $('bookingModal').style.display='flex';
}
function closeBooking(){
  if(submitting)return;
  $('bookingModal').style.display='none';
}
function setDefaultWeekday(){
  const day=parseDate($('formDate').value).getDay();
  document.querySelectorAll('#weekdayChecks input').forEach(el=>{
    el.checked=Number(el.value)===day;
  });
}
function makeRequestId(){
  if(crypto?.randomUUID)return crypto.randomUUID();
  throw new Error('瀏覽器不支援安全申請識別碼產生');
}
function selectedPeriods(){
  return [...document.querySelectorAll('#periodChecks input:checked')]
    .map(x=>x.value);
}
function selectedWeekdays(){
  return [...document.querySelectorAll('#weekdayChecks input:checked')]
    .map(x=>Number(x.value));
}
function buildBooking(){
  const date=$('formDate').value;
  const type=$('repeatType').value;
  const periods=selectedPeriods();

  if(!date)throw new Error('請選擇日期');
  if(date<iso(new Date()))throw new Error('不可預約過去日期');
  if(!periods.length)throw new Error('請選擇至少一個節次');

  const repeat=type==='weekly'
    ? {
        type:'weekly',
        start_date:date,
        end_date:$('repeatEnd').value,
        weekdays:selectedWeekdays()
      }
    : {type:'single'};

  if(type==='weekly'){
    if(!repeat.end_date || repeat.end_date<date)
      throw new Error('重複截止日期不可早於開始日期');
    if(!repeat.weekdays.length)
      throw new Error('請選擇重複星期');
  }

  return {
    request_id:makeRequestId(),
    venue_id:$('formVenue').value,
    date,
    period_ids:periods,
    activity_name:$('activityName').value.trim(),
    borrower_name:$('borrowerName').value.trim(),
    borrower_unit:$('borrowerUnit').value.trim(),
    website:$('websiteTrap').value,
    repeat
  };
}
function calculateDates(data){
  if(data.repeat.type==='single')return [data.date];
  const start=parseDate(data.date);
  const end=parseDate(data.repeat.end_date);
  if((end-start)/86400000>365)
    throw new Error('重複預約期間不可超過 365 天');
  const result=[];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    if(data.repeat.weekdays.includes(d.getDay()))
      result.push(iso(d));
    if(result.length>52)
      throw new Error('重複預約最多 52 個日期');
  }
  if(!result.length)throw new Error('沒有符合的重複日期');
  return result;
}
async function preflight(data){
  const dates=calculateDates(data);
  // GET 只作提示；真正的衝突檢查仍由 GAS
  // 在寫入鎖內執行。
  const results=await Promise.all(dates.map(date=>
    api('checkAvailability',{
      venue_id:data.venue_id,
      date,
      period_ids:data.period_ids.join(',')
    })
  ));
  const occupied=dates.filter((_,i)=>!results[i].available);
  if(occupied.length)
    throw new Error('以下日期已有占用：'+occupied.join('、'));
  return dates;
}
function postBooking(data){
  $('postForm').action=API;
  $('postPayload').value=JSON.stringify({
    action:'createBooking',data
  });
  $('postForm').submit();
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function pollBooking(id){
  // GAS 寫入可能晚於 iframe 提交完成。
  // 只在真正查到預約時宣告成功。
  for(let i=0;i<12;i++){
    await wait(i<4?2000:4000);
    try{
      const result=await api('getBookingStatus',{
        request_id:id
      });
      if(result.found)return result;
    }catch(_){
      // 繼續輪詢，最後保留「未確認」狀態。
    }
  }
  return null;
}
async function submitBooking(e){
  e.preventDefault();
  if(submitting)return;
  let data;
  try{
    data=buildBooking();
    submitting=true;
    $('submitBtn').disabled=true;
    $('submitBtn').textContent='正在檢查……';
    $('formResult').textContent='正在檢查場地與節次……';
    const dates=await preflight(data);

    if(!confirm(
      `確定送出申請？\n場地：${venueName(data.venue_id)}`+
      `\n日期數：${dates.length}\n節次：${data.period_ids.map(periodName).join('、')}`
    )){
      return;
    }

    pendingRequest=data;
    $('statusId').value=data.request_id;
    $('submitBtn').textContent='等待伺服器確認……';
    $('formResult').textContent=
      '正在送出，請勿關閉頁面或重複提交。\n申請識別碼：'+data.request_id;

    postBooking(data);
    const result=await pollBooking(data.request_id);

    if(result){
      $('formResult').textContent=
        '申請已建立！\n識別碼：'+data.request_id+
        '\n狀態：'+(STATUS[result.status]||result.status)+
        '\n日期數：'+result.count+
        '\n請保存識別碼以供日後查詢。';
      $('submitBtn').textContent='已送出';
      pendingRequest=null;
      await loadCalendar();
      return;
    }

    $('formResult').textContent=
      '尚無法確認伺服器是否收到申請。\n'+
      '識別碼：'+data.request_id+'\n'+
      '請先使用下方「查詢我的申請」確認，'+
      '不要立即重新送出，以免產生不同申請。';
    $('submitBtn').textContent='結果未確認';
  }catch(err){
    $('formResult').textContent='無法完成：'+err.message;
    $('submitBtn').textContent='重新檢查並送出';
    $('submitBtn').disabled=false;
  }finally{
    submitting=false;
  }
}
async function checkStatus(){
  const id=$('statusId').value.trim();
  if(!/^[0-9a-f-]{36}$/i.test(id)){
    $('statusResult').textContent='請輸入有效的申請識別碼';
    return;
  }
  $('statusResult').textContent='查詢中……';
  try{
    const r=await api('getBookingStatus',{request_id:id});
    $('statusResult').textContent=r.found
      ? `狀態：${STATUS[r.status]||r.status}\n預約日期數：${r.count}\n日期：${r.dates.join('、')}`
      : '目前查無此申請。若剛送出，請稍後再查詢。';
  }catch(e){
    $('statusResult').textContent='查詢失敗：'+e.message;
  }
}
async function init(){
  notice('正在連線場地預約系統……');
  try{
    initial=await api('getInitialData');
    const venues=initial.venues||[];
    if(!venues.length)throw new Error('目前沒有可用場地');
    const venueOptions=venues.map(v=>
      `<option value="${escapeHtml(v.venue_id)}">${escapeHtml(v.venue_name)}</option>`
    ).join('');
    $('venueSelect').innerHTML=venueOptions;
    $('formVenue').innerHTML=venueOptions;

    $('periodChecks').innerHTML=initial.periods.map(p=>
      `<label class="checkitem"><input type="checkbox" value="${escapeHtml(p.period_id)}">
      ${escapeHtml(p.period_name)}</label>`
    ).join('');

    $('weekdayChecks').innerHTML=
      ['日','一','二','三','四','五','六'].map((d,i)=>
        `<label class="checkitem"><input type="checkbox" value="${i}">星期${d}</label>`
      ).join('');

    updateViewButtons();
    await loadCalendar();
  }catch(e){
    notice('初始化失敗：'+e.message,'error');
  }
}
$('venueSelect').onchange=loadCalendar;
$('prevBtn').onclick=()=>moveCalendar(-1);
$('nextBtn').onclick=()=>moveCalendar(1);
$('todayBtn').onclick=()=>{
  cursor=new Date();loadCalendar();
};
document.querySelectorAll('[data-view]').forEach(b=>{
  b.onclick=()=>{
    view=b.dataset.view;
    updateViewButtons();
    loadCalendar();
  };
});
$('newBookingBtn').onclick=()=>openBooking(iso(cursor));
$('closeModal').onclick=closeBooking;
$('cancelForm').onclick=closeBooking;
$('formDate').onchange=()=>{
  $('repeatEnd').min=$('formDate').value;
  if($('repeatEnd').value<$('formDate').value)
    $('repeatEnd').value=$('formDate').value;
  setDefaultWeekday();
};
$('repeatType').onchange=()=>{
  $('weeklyFields').classList.toggle(
    'hidden',$('repeatType').value!=='weekly'
  );
};
$('bookingForm').onsubmit=submitBooking;
$('statusBtn').onclick=checkStatus;
init();
</script>
</body>
</html>
